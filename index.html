<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG for the home-screen icon and would fall back to a
         screenshot of the page, so this one has to be a raster. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#7b1e2b" />
    <title>KARTHIK WEDS SANTHIYA</title>
    <meta name="description" content="We're getting married! 💍 Click the link below to view our wedding invitation. We can't wait to celebrate with you!" />

    <!-- Open Graph. This invitation is shared mainly as a WhatsApp link, and
         WhatsApp builds its preview from og:* only — it does not read the
         meta description above, and it will not invent a thumbnail. Without
         these the link arrives as a bare grey URL.
         og:image must be a raster at an absolute URL; SVG is rejected by
         every major scraper, which is why /og-image.jpg exists alongside the
         SVG favicon. 1200x630 is the aspect ratio WhatsApp/Facebook crop to.
         The canonical production URL is written here so link-preview bots
         can resolve both the page and its thumbnail reliably. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://karthik-weds-santhiya.vercel.app/" />
    <meta property="og:site_name" content="Karthik weds Santhiya" />
    <meta property="og:title" content="Karthik weds Santhiya — 25 October 2026" />
    <meta property="og:description" content="We're getting married! 💍 Tap to view our wedding invitation. We can't wait to celebrate with you!" />
    <meta property="og:image" content="https://karthik-weds-santhiya.vercel.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Karthik and Santhiya, 25 October 2026, T.M.A Marriage Hall, Thirukarakavur" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Karthik weds Santhiya — 25 October 2026" />
    <meta name="twitter:description" content="We're getting married! 💍 Tap to view our wedding invitation." />
    <meta name="twitter:image" content="https://karthik-weds-santhiya.vercel.app/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Catamaran carries the Tamil glyph coverage none of the other families
         here have (Philosopher, Instrument Serif etc. are Latin-only), so the
         Tamil lines render in a chosen webfont rather than whatever system
         fallback each device happens to pick. -->
    <link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;700;800&family=Amethysta&family=Asul&family=Catamaran:wght@400;500;600&family=EB+Garamond:wght@700&family=Elsie+Swash+Caps&family=Instrument+Serif&family=Jost:wght@400;500;600&family=Junge&family=Lunasima&family=Lusitana&family=Luxurious+Script&family=Open+Sans&family=Philosopher:wght@400;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
